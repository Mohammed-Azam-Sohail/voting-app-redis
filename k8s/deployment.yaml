apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: voting-app
  labels:
    app: redis
  name: redis

spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  replicas: 1

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - redis
      securityContext:
        runAsUser: 999
        runAsGroup: 1000
        runAsNonRoot: true
      
      containers:
        - image: redis:alpine
          name: redis

          ports:
            - containerPort: 6379
              name: redis

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 20

          volumeMounts:
            - mountPath: /data
              name: redis-data

      volumes:
        - name: redis-data
          emptyDir: {}
